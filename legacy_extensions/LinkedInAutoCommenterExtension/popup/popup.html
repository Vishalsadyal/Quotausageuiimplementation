<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Fast Auto Commenter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-wrapper">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="brand-icon">⚡</div>
          <div class="brand-info">
            <h1>Auto Commenter</h1>
            <p class="subtitle">Personal Portfolio Booster</p>
          </div>
        </div>
        <div id="statusBadge" class="status-badge badge-idle">Idle</div>
      </header>

      <!-- Nav Tabs -->
      <div class="popup-nav">
        <button class="nav-tab active" id="tabMain">Controls</button>
        <button class="nav-tab" id="tabDebug">🛠️ Debug</button>
      </div>

      <!-- Main Content -->
      <main class="content">
        <!-- Main Pane -->
        <div id="paneMain" class="pane">
          <!-- Input Section -->
          <div class="section">
            <label class="label" for="commentInput">Your Comment / Pitch:</label>
            <textarea
              id="commentInput"
              class="textarea"
              rows="3"
              placeholder="Type comment message or portfolio link..."
            ></textarea>
            
            <div class="chips-row">
              <button type="button" class="chip" id="chipPortfolio">🔗 Portfolio Pitch</button>
              <button type="button" class="chip" id="chipShort">⚡ Short Connect</button>
            </div>
          </div>

          <!-- Delay & Limits -->
          <div class="grid-2">
            <div class="field">
              <label class="label" for="delayInput">Delay (sec)</label>
              <input type="number" id="delayInput" class="input" min="1" max="60" value="4" />
            </div>
            <div class="field">
              <label class="label" for="maxInput">Max Posts</label>
              <input type="number" id="maxInput" class="input" min="1" max="200" value="25" />
            </div>
          </div>

          <!-- Toggles -->
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="avoidJobSeekersToggle" checked />
              <span>🛡️ Avoid Job Seekers / #OpenToWork</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="skipLikedToggle" checked />
              <span>❤️ Skip posts already Liked / Commented</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="likeToggle" checked />
              <span>Auto-Like post before commenting</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="scrollToggle" checked />
              <span>Auto-scroll LinkedIn feed</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="debugToggle" checked />
              <span>Enable Debug & Highlighting</span>
            </label>
          </div>

          <!-- Stats Card -->
          <div class="stats-card">
            <div class="stat-item">
              <span class="stat-value" id="sessionCount">0</span>
              <span class="stat-name">This Session</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
              <span class="stat-value" id="totalCount">0</span>
              <span class="stat-name">Total Lifetime</span>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="actions">
            <button id="btnStart" class="btn btn-primary">
              <span>🚀 Start Commenting</span>
            </button>
            <div class="btn-group" id="runningGroup" style="display:none;">
              <button id="btnPause" class="btn btn-warning">
                <span>⏸️ Pause</span>
              </button>
              <button id="btnStop" class="btn btn-danger">
                <span>⏹️ Stop</span>
              </button>
            </div>
          </div>

          <!-- Secondary buttons -->
          <div class="actions-secondary">
            <button id="btnOpenLinkedIn" class="btn-link">
              <span>🌐 Open LinkedIn Feed</span>
            </button>
            <button id="btnResetHistory" class="btn-link-muted">
              <span>Reset History</span>
            </button>
          </div>
        </div>

        <!-- Debug Pane -->
        <div id="paneDebug" class="pane" style="display:none;">
          <div class="debug-actions">
            <button id="btnTestSingle" class="btn btn-test">
              <span>🧪 Test 1 Post</span>
            </button>
            <button id="btnClearDebug" class="btn btn-secondary">
              <span>Clear Logs</span>
            </button>
          </div>

          <div class="debug-terminal" id="debugTerminal">
            <div class="term-line info">[System] Debug console active.</div>
          </div>
        </div>

        <!-- Status / Alerts -->
        <div id="statusMessage" class="status-msg"></div>
      </main>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
